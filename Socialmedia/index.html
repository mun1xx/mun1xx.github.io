<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Social Media - Munix</title>


<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #ffffff;

    background:
        radial-gradient(
            circle at 85% 5%,
            rgba(125, 30, 185, 0.20),
            transparent 35%
        ),

        radial-gradient(
            circle at 10% 70%,
            rgba(80, 20, 140, 0.15),
            transparent 35%
        ),

        #08070d;

    overflow-x: hidden;
}


/* =========================
   GRID BACKGROUND
========================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    z-index: -1;

    background-image:

        linear-gradient(
            rgba(170, 70, 230, 0.08) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(170, 70, 230, 0.08) 1px,
            transparent 1px
        );

    background-size: 48px 48px;

    pointer-events: none;
}


/* =========================
   CONTAINER
========================= */

.container {

    width: 92%;

    max-width: 900px;

    margin: auto;
}


/* =========================
   HEADER
========================= */

header {

    text-align: center;

    padding:
        55px 0 40px;
}


.page-label {

    display: inline-block;

    padding:
        10px 20px;

    border:
        1px solid #8d35bd;

    border-radius: 30px;

    color: #c46cff;

    font-size: 16px;

    font-weight: bold;

    letter-spacing: 2px;

    box-shadow:
        0 0 15px
        rgba(190, 70, 255, 0.08);
}


/* =========================
   TITLE
========================= */

h1 {

    margin-top: 28px;

    font-size:
        clamp(45px, 10vw, 68px);

    font-weight: 800;

    letter-spacing: -2px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #ffffff,
            #bd5cff
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
}


.subtitle {

    margin-top: 12px;

    color: #8e8995;

    font-size: 18px;

    line-height: 1.5;
}


/* =========================
   SOCIAL GRID
========================= */

.social-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 22px;

    padding:
        10px 0 65px;
}


/* =========================
   SOCIAL CARD
========================= */

.social-card {

    min-height: 210px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 12px;

    background:
        rgba(15, 14, 20, 0.94);

    border:
        1px solid #642394;

    border-radius: 25px;

    color: white;

    text-decoration: none;

    transition:
        0.25s ease;
}


.social-card:hover {

    transform:
        translateY(-4px);

    border-color:
        #c367ff;

    box-shadow:
        0 0 28px
        rgba(180, 70, 255, 0.17);
}


/* =========================
   SOCIAL ICON
========================= */

.social-icon {

    width: 78px;

    height: 78px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid #7130a0;

    border-radius: 50%;

    color: #c269ff;

    font-size: 35px;

    box-shadow:
        inset 0 0 18px
        rgba(180, 60, 255, 0.05),

        0 0 18px
        rgba(180, 60, 255, 0.06);
}


/* SVG ICON */

.social-icon svg {

    width: 38px;

    height: 38px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* =========================
   SOCIAL NAME
========================= */

.social-card h2 {

    font-size: 22px;

    font-weight: 700;
}


/* =========================
   SUBTEXT
========================= */

.social-card p {

    color: #77727d;

    font-size: 14px;
}


/* =========================
   FOOTER
========================= */

footer {

    text-align: center;

    padding:
        20px 0 35px;

    color: #77727d;

    font-size: 15px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .container {

        width: 90%;
    }


    header {

        padding-top: 50px;
    }


    .social-grid {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 15px;
    }


    .social-card {

        min-height: 190px;

        border-radius: 22px;
    }


    .social-icon {

        width: 68px;

        height: 68px;
    }


    .social-icon svg {

        width: 32px;

        height: 32px;
    }


    .social-card h2 {

        font-size: 19px;
    }

}


@media (max-width: 380px) {

    .social-grid {

        grid-template-columns: 1fr;
    }

}

</style>

</head>
