<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APK Downloads - Munix</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 85% 5%,
            rgba(120, 25, 180, 0.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 10% 70%,
            rgba(70, 20, 130, 0.14),
            transparent 35%
        ),
        #08070d;

    overflow-x: hidden;
}


/* =========================
   GRID BACKGROUND
========================= */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    z-index: -1;

    background-image:
        linear-gradient(
            rgba(170, 70, 230, 0.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(170, 70, 230, 0.08) 1px,
            transparent 1px
        );

    background-size: 48px 48px;

    pointer-events: none;
}


/* =========================
   CONTAINER
========================= */

.container {
    width: 92%;
    max-width: 900px;
    margin: auto;
}


/* =========================
   HEADER
========================= */

header {
    text-align: center;
    padding: 55px 0 40px;
}

.page-label {
    display: inline-block;

    padding: 10px 20px;

    border: 1px solid #8d35bd;
    border-radius: 30px;

    color: #c46cff;

    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;

    box-shadow:
        0 0 15px rgba(190, 70, 255, 0.08);
}


h1 {
    margin-top: 28px;

    font-size: clamp(42px, 10vw, 68px);

    font-weight: 800;
    letter-spacing: -2px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #ffffff,
            #bd5cff
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}


.subtitle {
    margin-top: 12px;

    color: #8e8995;

    font-size: 18px;
    line-height: 1.5;
}


/* =========================
   VERSION SECTION
========================= */

.version-section {
    padding: 10px 0 60px;
}


.version-title {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 20px;

    font-size: 21px;
    font-weight: 700;
}


.version-title::before {
    content: "";

    width: 4px;
    height: 25px;

    background: #00e676;

    border-radius: 2px;

    box-shadow:
        0 0 10px rgba(0, 230, 118, 0.45);
}


/* =========================
   APK CARD
========================= */

.apk-card {
    width: 100%;
    max-width: 370px;

    margin: auto;

    padding: 24px;

    text-align: center;

    background:
        rgba(17, 17, 20, 0.96);

    border: 1px solid #29282e;

    border-radius: 20px;

    transition: 0.25s ease;
}


.apk-card:hover {
    transform: translateY(-4px);

    border-color: #8e38c2;

    box-shadow:
        0 0 30px rgba(170, 60, 255, 0.16);
}


/* =========================
   APK ICON
========================= */

.apk-icon {
    width: 105px;
    height: 105px;

    margin: 0 auto 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #21122c,
            #100d15
        );

    border: 1px solid #7130a0;

    color: #c269ff;

    box-shadow:
        0 0 25px rgba(180, 70, 255, 0.12);
}


.apk-icon svg {
    width: 52px;
    height: 52px;

    fill: none;

    stroke: #c269ff;

    stroke-width: 1.7;

    stroke-linecap: round;
    stroke-linejoin: round;

    filter:
        drop-shadow(
            0 0 8px
            rgba(194, 105, 255, 0.55)
        );
}


/* =========================
   GAME NAME
========================= */

.apk-name {
    font-size: 21px;

    font-weight: 700;

    margin-bottom: 6px;
}


.apk-version {
    color: #77727d;

    font-size: 14px;

    margin-bottom: 20px;
}


/* =========================
   INFO
========================= */

.apk-info {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 18px;

    padding: 12px;

    background:
        rgba(255, 255, 255, 0.025);

    border-radius: 9px;

    color: #99939e;

    font-size: 12px;
}


.verified {
    color: #bdb8c2;
}


.verified-icon {
    display: inline-flex;

    vertical-align: middle;

    margin-right: 4px;

    color: #00e676;
}


.verified-icon svg {
    width: 14px;
    height: 14px;

    fill: none;

    stroke: currentColor;

    stroke-width: 2;

    stroke-linecap: round;
    stroke-linejoin: round;
}


/* =========================
   DOWNLOAD BUTTON
========================= */

.download-button {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 9px;

    width: 100%;

    padding: 13px 15px;

    background: #00d968;

    color: #041109;

    border-radius: 9px;

    text-decoration: none;

    font-size: 14px;

    font-weight: 700;

    transition: 0.2s ease;
}


.download-button:hover {
    background: #16f27c;

    transform: translateY(-2px);

    box-shadow:
        0 6px 20px
        rgba(0, 230, 118, 0.20);
}


/* Download SVG */

.download-button svg {
    width: 20px;
    height: 20px;

    fill: none;

    stroke: currentColor;

    stroke-width: 2;

    stroke-linecap: round;
    stroke-linejoin: round;

    transition: 0.25s ease;
}


.download-button:hover svg {
    transform: translateY(3px);
}


/* =========================
   FOOTER
========================= */

footer {
    text-align: center;

    padding:
        20px 0 35px;

    color: #77727d;

    font-size: 15px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    .container {
        width: 90%;
    }

    header {
        padding-top: 50px;
    }

    .page-label {
        font-size: 15px;

        padding:
            9px 18px;
    }

    h1 {
        font-size: 45px;
    }

    .subtitle {
        font-size: 17px;
    }

    .version-title {
        font-size: 19px;
    }

    .apk-card {
        padding: 21px;

        max-width: 350px;
    }

    .apk-icon {
        width: 100px;
        height: 100px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="page-label">
            APK DOWNLOADS
        </div>

        <h1>
            Game APKs
        </h1>

        <p class="subtitle">
            Download verified Munix game builds.
        </p>

    </header>



    <!-- =========================
         VERSION
    ========================= -->

    <section class="version-section">


        <div class="version-title">
            1.1.3.1 APKs List
        </div>



        <!-- =========================
             APK CARD
        ========================= -->

        <div class="apk-card">


            <!-- Beautiful SVG APK/download icon -->

            <div class="apk-icon">

                <svg viewBox="0 0 24 24">

                    <path d="M12 3v11"></path>

                    <path d="M7 10l5 5 5-5"></path>

                    <path d="M5 21h14"></path>

                </svg>

            </div>



            <!-- GAME NAME -->

            <div class="apk-name">
                MUNAF CLIENT
            </div>



            <!-- VERSION -->

            <div class="apk-version">
                Version 1.1.3.1
            </div>



            <!-- INFORMATION -->

            <div class="apk-info">

                <span>
                    55 MB
                </span>


                <span class="verified">

                    <span class="verified-icon">

                        <svg viewBox="0 0 24 24">

                            <path d="M20 6L9 17l-5-5"></path>

                        </svg>

                    </span>

                    Verified

                </span>

            </div>



            <!-- =========================
                 DOWNLOAD BUTTON
            ========================= -->

            <a
                href="https://www.mediafire.com/file/e4aw20ovkkv3gzw/MUNAF+CLIENT+1.1.3.1.apk/file"
                class="download-button"
                target="_blank"
                rel="noopener noreferrer"
            >

                <svg viewBox="0 0 24 24">

                    <path d="M12 3v12"></path>

                    <path d="M7 10l5 5 5-5"></path>

                    <path d="M5 21h14"></path>

                </svg>

                Download APK

            </a>


        </div>

    </section>



    <!-- FOOTER -->

    <footer>

        © 2026 Munix

    </footer>


</div>


</body>

  </html>
